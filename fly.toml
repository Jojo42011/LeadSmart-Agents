# Fly.io — LeadSmart Ringba Scrub Agent + dashboard
# https://fly.io/docs/reference/configuration/

app = 'leadsmart-ringba-scrub'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  DATA_DIR = '/app/data'
  DRY_RUN = 'false'
  POLL_INTERVAL_MS = '28800000'
  CALL_DELAY_MS = '500'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'scrub_data'
  destination = '/app/data'
