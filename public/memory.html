<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadSmart · Memory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080808;
        --panel: #101010;
        --card: #141414;
        --border: #222;
        --border-bright: #2e2e2e;
        --cyan: #00ffff;
        --cyan-dim: rgba(0, 255, 255, 0.45);
        --green: #00ff88;
        --amber: #ffb000;
        --text: #e4e4e4;
        --text-dim: #777;
        --font: "JetBrains Mono", monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
      }
      .shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--cyan);
      }
      .brand span { color: var(--text-dim); }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .nav a {
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--text-dim);
        padding: 8px 12px;
        border: 1px solid var(--border);
        transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
      }
      .nav a:hover {
        color: var(--cyan);
        border-color: var(--cyan-dim);
      }
      .nav a.active {
        color: var(--cyan);
        border-color: var(--cyan-dim);
        box-shadow: 0 0 16px rgba(0, 255, 255, 0.08);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 16px;
      }
      .stat__label {
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--text-dim);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .stat__value {
        font-size: 22px;
        font-weight: 600;
        color: var(--green);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
        align-items: center;
      }
      .tabs {
        display: flex;
        gap: 0;
        border: 1px solid var(--border-bright);
      }
      .tab {
        font-family: var(--font);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 10px 16px;
        border: none;
        border-right: 1px solid var(--border-bright);
        background: var(--bg);
        color: var(--text-dim);
        cursor: pointer;
      }
      .tab:last-child { border-right: none; }
      .tab.active {
        background: rgba(0, 255, 255, 0.08);
        color: var(--cyan);
      }
      .search {
        flex: 1;
        min-width: 200px;
        max-width: 360px;
        background: var(--panel);
        border: 1px solid var(--border-bright);
        color: var(--text);
        font-family: var(--font);
        font-size: 12px;
        padding: 10px 12px;
      }
      .search:focus {
        outline: none;
        border-color: var(--cyan-dim);
      }
      .live-dot {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--text-dim);
        margin-left: auto;
      }
      .live-dot.on { color: var(--green); }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        min-height: 420px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        font-size: 9px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-dim);
        background: rgba(0, 0, 0, 0.25);
        position: sticky;
        top: 0;
      }
      .table-wrap {
        max-height: 520px;
        overflow: auto;
      }
      .mono { font-variant-numeric: tabular-nums; }
      .dim { color: var(--text-dim); }
      .tag {
        display: inline-block;
        font-size: 9px;
        letter-spacing: 1px;
        padding: 3px 8px;
        border: 1px solid var(--border-bright);
        color: var(--amber);
        text-transform: uppercase;
      }
      .empty {
        padding: 48px 24px;
        text-align: center;
        color: var(--text-dim);
        letter-spacing: 2px;
        font-size: 11px;
        text-transform: uppercase;
      }
      .synthesis-block {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
      }
      .synthesis-block:last-child { border-bottom: none; }
      .synthesis-block p {
        line-height: 1.65;
        white-space: pre-wrap;
      }
      .synthesis-meta {
        font-size: 10px;
        color: var(--text-dim);
        margin-bottom: 10px;
        letter-spacing: 1px;
      }
      .graph-search {
        display: flex;
        gap: 8px;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .graph-search input {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--border-bright);
        color: var(--text);
        font-family: var(--font);
        padding: 10px 12px;
      }
      .graph-search button {
        font-family: var(--font);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 10px 14px;
        border: 1px solid var(--cyan-dim);
        background: rgba(0, 255, 255, 0.06);
        color: var(--cyan);
        cursor: pointer;
      }
      .banner {
        margin-bottom: 16px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 176, 0, 0.4);
        color: var(--amber);
        font-size: 11px;
        display: none;
      }
      .banner.show { display: block; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">LEADSMART <span>// MEMORY CORE</span></div>
        <nav class="nav">
          <a href="/">Scrub</a>
          <a href="/payments">Payments</a>
          <a href="/jarvis">JARVIS</a>
          <a href="/memory" class="active">Memory</a>
        </nav>
      </header>

      <div class="banner" id="banner"></div>

      <section class="stats" id="stats">
        <article class="stat"><div class="stat__label">Facts</div><div class="stat__value" id="statFacts">—</div></article>
        <article class="stat"><div class="stat__label">Episodes</div><div class="stat__value" id="statEpisodes">—</div></article>
        <article class="stat"><div class="stat__label">Nodes</div><div class="stat__value" id="statNodes">—</div></article>
        <article class="stat"><div class="stat__label">Edges</div><div class="stat__value" id="statEdges">—</div></article>
        <article class="stat"><div class="stat__label">Rules</div><div class="stat__value" id="statRules">—</div></article>
        <article class="stat"><div class="stat__label">Syntheses</div><div class="stat__value" id="statSynth">—</div></article>
      </section>

      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button type="button" class="tab active" data-tab="facts">Facts</button>
          <button type="button" class="tab" data-tab="episodes">Episodes</button>
          <button type="button" class="tab" data-tab="rules">Rules</button>
          <button type="button" class="tab" data-tab="graph">Graph</button>
          <button type="button" class="tab" data-tab="syntheses">Syntheses</button>
        </div>
        <input type="search" class="search" id="searchInput" placeholder="Search facts..." />
        <span class="live-dot" id="liveDot">OFFLINE</span>
      </div>

      <section class="panel" id="panel"></section>
    </div>

    <script>
      "use strict";

      let activeTab = "facts";
      let ws = null;

      const panel = document.getElementById("panel");
      const searchInput = document.getElementById("searchInput");
      const banner = document.getElementById("banner");
      const liveDot = document.getElementById("liveDot");

      function showBanner(msg) {
        banner.textContent = msg;
        banner.classList.add("show");
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtDate(iso) {
        if (!iso) return "—";
        try {
          return new Date(iso).toLocaleString("en-US", {
            timeZone: "America/Chicago",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch {
          return iso;
        }
      }

      async function loadOverview() {
        const res = await fetch("/api/memory/overview");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load overview");
        document.getElementById("statFacts").textContent = data.factCount;
        document.getElementById("statEpisodes").textContent = data.episodeCount;
        document.getElementById("statNodes").textContent = data.nodeCount;
        document.getElementById("statEdges").textContent = data.edgeCount;
        document.getElementById("statRules").textContent = data.ruleCount;
        document.getElementById("statSynth").textContent = data.synthesisCount;
      }

      async function renderFacts() {
        const q = searchInput.value.trim();
        const url =
          "/api/memory/facts?limit=200" + (q ? "&q=" + encodeURIComponent(q) : "");
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load facts");
        const rows = data.facts || [];
        if (!rows.length) {
          panel.innerHTML = '<div class="empty">No facts found</div>';
          return;
        }
        panel.innerHTML =
          '<div class="table-wrap"><table><thead><tr><th>Content</th><th>Category</th><th>Strength</th><th>Access</th><th>Updated</th></tr></thead><tbody>' +
          rows
            .map(
              (r) =>
                "<tr><td>" +
                escapeHtml(r.content) +
                "</td><td><span class=\"tag\">" +
                escapeHtml(r.category || "general") +
                "</span></td><td class=\"mono\">" +
                Number(r.strength || 0).toFixed(2) +
                "</td><td class=\"mono\">" +
                Number(r.access_count || 0) +
                "</td><td class=\"dim mono\">" +
                fmtDate(r.last_accessed || r.created_at) +
                "</td></tr>"
            )
            .join("") +
          "</tbody></table></div>";
      }

      async function renderEpisodes() {
        const res = await fetch("/api/memory/episodes?limit=100");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load episodes");
        const rows = data.episodes || [];
        if (!rows.length) {
          panel.innerHTML = '<div class="empty">No episodes yet</div>';
          return;
        }
        panel.innerHTML =
          '<div class="table-wrap"><table><thead><tr><th>Summary</th><th>Tone</th><th>When</th></tr></thead><tbody>' +
          rows
            .map(
              (r) =>
                "<tr><td>" +
                escapeHtml(r.summary) +
                "</td><td class=\"dim\">" +
                escapeHtml(r.tone || "—") +
                "</td><td class=\"dim mono\">" +
                fmtDate(r.timestamp) +
                "</td></tr>"
            )
            .join("") +
          "</tbody></table></div>";
      }

      async function renderRules() {
        const res = await fetch("/api/memory/rules?limit=100");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load rules");
        const rows = data.rules || [];
        if (!rows.length) {
          panel.innerHTML = '<div class="empty">No rules stored</div>';
          return;
        }
        panel.innerHTML =
          '<div class="table-wrap"><table><thead><tr><th>Trigger</th><th>Action</th><th>Confidence</th><th>Uses</th></tr></thead><tbody>' +
          rows
            .map(
              (r) =>
                "<tr><td>" +
                escapeHtml(r.trigger_condition) +
                "</td><td>" +
                escapeHtml(r.action) +
                "</td><td class=\"mono\">" +
                Number(r.confidence || 0).toFixed(2) +
                "</td><td class=\"mono\">" +
                Number(r.use_count || 0) +
                "</td></tr>"
            )
            .join("") +
          "</tbody></table></div>";
      }

      async function renderSyntheses() {
        const res = await fetch("/api/memory/syntheses?limit=20");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load syntheses");
        const rows = data.syntheses || [];
        if (!rows.length) {
          panel.innerHTML = '<div class="empty">No weekly syntheses yet</div>';
          return;
        }
        panel.innerHTML = rows
          .map(
            (r) =>
              '<article class="synthesis-block"><div class="synthesis-meta">' +
              fmtDate(r.created_at) +
              "</div><p>" +
              escapeHtml(r.content) +
              "</p></article>"
          )
          .join("");
      }

      function renderGraphPanel() {
        panel.innerHTML =
          '<div class="graph-search"><input type="text" id="graphEntity" placeholder="Entity name..." /><button type="button" id="graphBtn">Traverse</button></div><div id="graphOut"><div class="empty">Enter an entity to explore connections</div></div>';
        document.getElementById("graphBtn").addEventListener("click", () => void loadGraph());
        document.getElementById("graphEntity").addEventListener("keydown", (e) => {
          if (e.key === "Enter") void loadGraph();
        });
      }

      async function loadGraph() {
        const entity = document.getElementById("graphEntity").value.trim();
        if (!entity) return;
        const out = document.getElementById("graphOut");
        out.innerHTML = '<div class="empty">Loading...</div>';
        const res = await fetch("/api/memory/graph?entity=" + encodeURIComponent(entity));
        const data = await res.json();
        if (!res.ok) {
          out.innerHTML = '<div class="empty">' + escapeHtml(data.error || "Failed") + "</div>";
          return;
        }
        if (!data.node) {
          out.innerHTML = '<div class="empty">No node found for "' + escapeHtml(entity) + '"</div>';
          return;
        }
        const connections = data.connections || [];
        out.innerHTML =
          '<div class="table-wrap"><table><thead><tr><th>Relationship</th><th>Connected To</th><th>Type</th></tr></thead><tbody>' +
          (connections.length
            ? connections
                .map(
                  (c) =>
                    "<tr><td>" +
                    escapeHtml(c.relationship) +
                    "</td><td>" +
                    escapeHtml(c.name) +
                    "</td><td class=\"dim\">" +
                    escapeHtml(c.type || "—") +
                    "</td></tr>"
                )
                .join("")
            : '<tr><td colspan="3" class="empty">No edges for this entity</td></tr>') +
          "</tbody></table></div>";
      }

      async function refreshAll() {
        try {
          await loadOverview();
          searchInput.style.display = activeTab === "facts" ? "" : "none";
          if (activeTab === "facts") await renderFacts();
          else if (activeTab === "episodes") await renderEpisodes();
          else if (activeTab === "rules") await renderRules();
          else if (activeTab === "graph") renderGraphPanel();
          else if (activeTab === "syntheses") await renderSyntheses();
        } catch (err) {
          showBanner(err.message || "Failed to load memory");
        }
      }

      document.getElementById("tabs").addEventListener("click", (e) => {
        const btn = e.target.closest(".tab");
        if (!btn) return;
        activeTab = btn.dataset.tab;
        document.querySelectorAll(".tab").forEach((t) => {
          t.classList.toggle("active", t === btn);
        });
        void refreshAll();
      });

      searchInput.addEventListener("input", () => {
        if (activeTab === "facts") void renderFacts();
      });

      function connectEvents() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(proto + "//" + location.host + "/api/hull/events");
        ws.onopen = () => {
          liveDot.textContent = "LIVE";
          liveDot.classList.add("on");
        };
        ws.onclose = () => {
          liveDot.textContent = "OFFLINE";
          liveDot.classList.remove("on");
          setTimeout(connectEvents, 4000);
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "memory_updated") void refreshAll();
          } catch { /* ignore */ }
        };
      }

      void refreshAll();
      connectEvents();
    </script>
  </body>
</html>
